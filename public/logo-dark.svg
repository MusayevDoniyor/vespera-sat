<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Left Wing Gradient: Electric Cyan into Deep Sapphire -->
    <linearGradient id="vespera-dark-cyan" x1="16" y1="26" x2="46" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#00c6ff" />
      <stop offset="80%" stop-color="#0072ff" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Right Wing Gradient: Royal Indigo into Vibrant Purple -->
    <linearGradient id="vespera-dark-violet" x1="46" y1="86" x2="76" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Natural Soft Shadow between overlapping wings -->
    <filter id="vespera-dark-wing-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="2" stdDeviation="2.8" flood-color="#090d16" flood-opacity="0.55" />
    </filter>

    <!-- Ambient Beacon Starlight Glow -->
    <radialGradient id="vespera-dark-star-glow" cx="80" cy="18" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Star Core Radiant Gradient -->
    <linearGradient id="vespera-dark-star-core" x1="76" y1="12" x2="84" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Overall Mark Ambient Shadow for physical surface lift -->
    <filter id="vespera-dark-ambient-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Ambient Beacon Starlight Glow (completely transparent background, no box!) -->
  <circle cx="80" cy="18" r="22" fill="url(#vespera-dark-star-glow)" />

  <g filter="url(#vespera-dark-ambient-shadow)">
    <!-- Right Wing (Behind left wing, optically balanced at X=46..76) -->
    <path
      d="M 76 26 L 58 26 L 46 64 L 46 86 Z"
      fill="url(#vespera-dark-violet)"
    />

    <!-- Left Wing (Casts gentle drop shadow onto right wing, X=16..46) -->
    <path
      d="M 16 26 L 34 26 L 46 64 L 46 86 Z"
      fill="url(#vespera-dark-cyan)"
      filter="url(#vespera-dark-wing-shadow)"
    />
  </g>

  <!-- The Vespera Evening Star Beacon (Balanced apex at cx=80, cy=18) -->
  <!-- Outer Star Flare -->
  <path
    d="M 80 4 Q 80 18 94 18 Q 80 18 80 32 Q 80 18 66 18 Q 80 18 80 4 Z"
    fill="#38bdf8"
  />

  <!-- Inner Diamond Flare -->
  <path
    d="M 80 8 Q 80 18 90 18 Q 80 18 80 28 Q 80 18 70 18 Q 80 18 80 8 Z"
    fill="url(#vespera-dark-star-core)"
  />

  <!-- White-hot diamond spark center -->
  <circle cx="80" cy="18" r="2.2" fill="#ffffff" />
</svg>