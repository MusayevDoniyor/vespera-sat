<svg width="128" height="128" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vespera-logo-grad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <radialGradient id="vespera-logo-glow" cx="50" cy="50" r="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <filter id="vespera-logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1e3a8a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Glow Halo -->
  <circle cx="50" cy="50" r="44" fill="url(#vespera-logo-glow)" />

  <!-- Hexagonal / Chamfered Rounded Shield -->
  <rect x="12" y="12" width="76" height="76" rx="22" fill="url(#vespera-logo-grad)" filter="url(#vespera-logo-shadow)" />

  <!-- Subtle Geometric Coordinate Grid -->
  <path d="M 12 36 L 88 36 M 12 64 L 88 64 M 36 12 L 36 88 M 64 12 L 64 88" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Celestial Orbital Ring -->
  <ellipse cx="50" cy="50" rx="32" ry="14" transform="rotate(-28 50 50)" stroke="#ffffff" stroke-opacity="0.38" stroke-width="2.5" stroke-dasharray="4 2" />

  <!-- Left Wing of Chevron V -->
  <path d="M 28 32 L 50 72 L 44 72 L 24 32 Z" fill="#ffffff" fill-opacity="0.95" />

  <!-- Right Wing of Chevron V -->
  <path d="M 72 32 L 50 72 L 56 72 L 76 32 Z" fill="#ffffff" fill-opacity="0.75" />

  <!-- Guiding Diamond Star Beacon (Vespera) -->
  <path d="M 50 22 L 54 36 L 68 40 L 54 44 L 50 58 L 46 44 L 32 40 L 46 36 Z" fill="#ffffff" />

  <!-- Starlight Core -->
  <circle cx="50" cy="40" r="3.5" fill="#38bdf8" />
  <circle cx="50" cy="40" r="1.5" fill="#ffffff" />
</svg>
